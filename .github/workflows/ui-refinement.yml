name: UI refinement browser checks
on: [pull_request]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-refinement-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-screenshots
          path: /tmp/admin-refinement-*.png
          if-no-files-found: ignore
