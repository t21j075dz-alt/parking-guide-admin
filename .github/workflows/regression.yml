name: YOLO and admin regression checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax
        run: node scripts/check-source.cjs
      - name: Run admin tests
        run: node --test tests/*.test.cjs
      - name: Install dependencies for camera snapshot tests
        run: python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
      - name: Run pure tracking tests (no camera or cloud)
        working-directory: parking-vision
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python syntax checks
        run: python -m compileall -q parking-vision

  browser-ui:
    name: Camera calibration browser smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile camera/map workflow
        run: node tests/camera-alignment-browser.cjs
      - name: Keep visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-map-ui-smoke
          path: |
            /tmp/parking-camera-alignment-desktop.png
            /tmp/parking-camera-alignment-mobile.png
          if-no-files-found: ignore

  powershell-51-syntax:
    name: Windows PowerShell 5.1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every PowerShell file without running camera or network code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path 'parking-vision' -Recurse -Filter '*.ps1' -File
          if ($files.Count -eq 0) { throw 'No PowerShell files found' }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($issue in $parseErrors) {
                Write-Host ($file.FullName + ':' + $issue.Extent.StartLineNumber + ' ' + $issue.Message)
              }
              throw ('PowerShell 5.1 syntax error: ' + $file.Name)
            }
            Write-Host ('OK: ' + $file.Name)
          }
