name: YOLO and admin regression checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax
        run: node --check admin.js && node --check admin-i18n.js && node --check recording-demo.js && node --check admin-voice.js && node --check voice-speech-readings.js && node --check camera-map-alignment-core.js && node --check camera-map-alignment.js && node --check admin-camera-shortcuts.js
      - name: Run admin tests
        run: node --test tests/*.test.cjs
      - name: Install dependencies for camera snapshot tests
        run: python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
      - name: Run pure tracking tests (no camera or cloud)
        working-directory: parking-vision
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python syntax checks
        run: python -m py_compile parking-vision/nikko_video_config.py parking-vision/import_nikko_map_alignment.py parking-vision/export_nikko_recording.py parking-vision/video_demo_support.py parking-vision/video_replay.py parking-vision/verify_map_alignment.py parking-vision/import_map_alignment.py parking-vision/monitor.py parking-vision/camera_recording.py parking-vision/yolo_visual_recording.py parking-vision/camera_exposure.py parking-vision/select_external_camera.py parking-vision/calibrate.py parking-vision/train_obstacles.py parking-vision/analyze_video.py parking-vision/label_obstacles.py parking-vision/stable_ids.py parking-vision/compare_tracking.py parking-vision/evaluate_slots.py

  browser-ui:
    name: Camera calibration browser smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile camera/map workflow
        run: node tests/camera-alignment-browser.cjs
      - name: Keep visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-map-ui-smoke
          path: |
            /tmp/parking-camera-alignment-desktop.png
            /tmp/parking-camera-alignment-mobile.png
          if-no-files-found: ignore

  powershell-51-syntax:
    name: Windows PowerShell 5.1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every PowerShell file without running camera or network code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path 'parking-vision' -Recurse -Filter '*.ps1' -File
          if ($files.Count -eq 0) { throw 'No PowerShell files found' }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($issue in $parseErrors) {
                Write-Host ($file.FullName + ':' + $issue.Extent.StartLineNumber + ' ' + $issue.Message)
              }
              throw ('PowerShell 5.1 syntax error: ' + $file.Name)
            }
            Write-Host ('OK: ' + $file.Name)
          }
